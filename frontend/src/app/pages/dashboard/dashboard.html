<div class="dashboard-page">

  <!-- HEADER STRIP -->
  <div class="dashboard-header">
    <div class="dashboard-header-inner">
      <h2>Dashboard</h2>
    </div>
  </div>


  <div class="dashboard-content">

    <div class="card-grid">

      <div class="card">
        <p>Total Revenue</p>
        <h3>₹{{ totalRevenue }}</h3>
      </div>

      <div class="card">
        <p>Pending Invoices</p>
        <h3>{{ pendingInvoices }}</h3>
      </div>

      <div class="card">
        <p>Total Customers</p>
        <h3>{{ totalCustomers }}</h3>
      </div>

      <div class="card">
        <p>Total Invoices</p>
        <h3>{{ totalInvoices }}</h3>
      </div>

    </div>

  </div>

</div>
